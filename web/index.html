<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riley Core</title><style>body{font:16px system-ui;background:#020508;color:#c8e8f8;max-width:760px;margin:30px auto;padding:15px}#chat{height:50vh;overflow:auto;border:1px solid #1a3050;padding:12px;white-space:pre-wrap}input,textarea{background:#0f1d2e;color:#c8e8f8;padding:10px}input{width:70%}button{padding:10px;background:#00b4ff;border:0;cursor:pointer}.msg{padding:8px;border-bottom:1px solid #1a3050}details{margin-top:20px}</style></head><body><h1>RILEY <small>CORE v0.1</small></h1><p id="status">Connecting...</p><div id="chat"></div><form id="form"><input id="message" placeholder="Talk to Riley" required><button>Send</button></form><details><summary>Authorized file workspace</summary><p><input id="path" placeholder="notes/example.txt"></p><textarea id="content" rows="5" cols="60"></textarea><p><button id="read" type="button">Read</button> <button id="preview" type="button">Preview write</button> <button id="approve" type="button" hidden>Approve write</button></p><p id="notice"></p></details><script>
const $=id=>document.getElementById(id);let pending=null;
async function api(route,body){let r=await fetch('/api/'+route,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x}
function add(role,text){let e=document.createElement('div');e.className='msg';e.textContent=role+': '+text;$('chat').append(e);$('chat').scrollTop=$('chat').scrollHeight}
(async()=>{try{$('status').textContent=JSON.stringify(await api('status'));(await api('history')).messages.forEach(x=>add(x.role,x.content))}catch(e){$('status').textContent=e.message}})();
$('form').onsubmit=async e=>{e.preventDefault();let m=$('message').value;$('message').value='';add('You',m);try{add('Riley',(await api('chat',{message:m})).reply)}catch(e){add('Error',e.message)}};
$('read').onclick=async()=>{try{$('content').value=(await api('file/read',{path:$('path').value})).content;$('notice').textContent='Read complete'}catch(e){$('notice').textContent=e.message}};
$('preview').onclick=async()=>{try{pending={path:$('path').value,content:$('content').value};let p=await api('file/preview',pending);pending.token=p.token;$('notice').textContent='Preview: '+p.preview;$('approve').hidden=false}catch(e){$('notice').textContent=e.message}};
$('approve').onclick=async()=>{if(!pending||pending.path!==$('path').value||pending.content!==$('content').value){$('approve').hidden=true;return}if(!confirm('Write '+pending.path+'?'))return;try{await api('file/write',{...pending,approve:true});$('notice').textContent='Saved';$('approve').hidden=true}catch(e){$('notice').textContent=e.message}};
</script></body></html>
