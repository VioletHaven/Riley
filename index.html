<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#020508">
<title>RILEY</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #020508;
  --panel: #0a1520;
  --cyan: #00b4ff;
  --cyan-dim: #1a5070;
  --amber: #ffa040;
  --text: #c8e8f8;
  --dim: #3a6a8a;
  --muted: #1a3a4a;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
body::before {
  content:'';
  position:fixed;
  inset:0;
  background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(0,140,220,0.1) 0%, transparent 70%);
  pointer-events:none;
  z-index:0;
}
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(2,5,8,0.95);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal.show { display: flex; }
.modal-box {
  background: var(--panel);
  border: 1px solid rgba(0,180,255,0.4);
  border-radius: 16px;
  padding: 28px 24px;
  max-width: 400px;
  width: 100%;
}
.modal-box h2 { font-size: 1.1rem; color: var(--cyan); letter-spacing: 0.15em; margin-bottom: 8px; }
.modal-box p { font-size: 0.8rem; color: var(--dim); line-height: 1.6; margin-bottom: 16px; }
.modal-box a { color: var(--cyan); }
.modal-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid rgba(0,180,255,0.2);
  border-radius: 8px;
  color: var(--text);
  font-family: monospace;
  font-size: 0.8rem;
  padding: 10px 12px;
  outline: none;
  margin-bottom: 6px;
}
.modal-input:focus { border-color: rgba(0,180,255,0.5); }
.modal-btn {
  width: 100%;
  background: linear-gradient(135deg, rgba(0,180,255,0.2), rgba(0,100,180,0.3));
  border: 1px solid rgba(0,180,255,0.4);
  border-radius: 8px;
  color: var(--cyan);
  font-size: 0.9rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  padding: 10px;
  cursor: pointer;
  margin-top: 6px;
}
.modal-error { font-size: 0.72rem; color: #ff6060; min-height: 16px; }
.modal-note { font-size: 0.65rem; color: var(--muted); text-align: center; margin-top: 10px; }
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid rgba(0,180,255,0.15);
  flex-shrink: 0;
  position: relative;
  z-index: 1;
}
.logo { display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,180,255,0.3), rgba(0,60,120,0.8));
  border: 1px solid rgba(0,180,255,0.5);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.title { font-size: 1.2rem; font-weight: 700; color: var(--cyan); letter-spacing: 0.15em; }
.subtitle { font-size: 0.65rem; color: var(--dim); letter-spacing: 0.2em; }
.status { display: flex; align-items: center; gap: 6px; font-size: 0.65rem; color: var(--dim); }
.status-dot { width: 6px; height: 6px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 6px #00ff88; animation: blink 3s ease-in-out infinite; }
@keyframes blink { 0%,90%,100%{opacity:1} 95%{opacity:0.2} }
.key-btn { width:32px;height:32px;background:rgba(255,160,64,0.07);border:1px solid rgba(255,160,64,0.2);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;margin-right:8px; }
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: relative;
  z-index: 1;
  -webkit-overflow-scrolling: touch;
}
.msg { display: flex; gap: 8px; animation: msg-in 0.25s ease-out; }
@keyframes msg-in { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.msg.user { flex-direction: row-reverse; }
.msg-av { width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;flex-shrink:0; }
.msg.assistant .msg-av { background:radial-gradient(circle,rgba(0,180,255,0.3),rgba(0,60,120,0.8));border:1px solid rgba(0,180,255,0.4);color:var(--cyan); }
.msg.user .msg-av { background:rgba(255,160,64,0.1);border:1px solid rgba(255,160,64,0.3);color:var(--amber); }
.msg-inner { max-width: 80%; }
.msg.user .msg-inner { display: flex; flex-direction: column; align-items: flex-end; }
.msg-name { font-size:0.65rem;font-weight:700;margin-bottom:3px; }
.msg.assistant .msg-name { color:var(--cyan); }
.msg.user .msg-name { color:var(--amber); }
.msg-bubble { padding:9px 13px;border-radius:12px;font-size:0.88rem;line-height:1.6; }
.msg.assistant .msg-bubble { background:var(--panel);border:1px solid rgba(0,180,255,0.15);border-top-left-radius:4px; }
.msg.user .msg-bubble { background:rgba(255,160,64,0.07);border:1px solid rgba(255,160,64,0.2);color:#e0c8a0;border-top-right-radius:4px;text-align:right; }
.typing { display:flex;gap:4px;align-items:center;padding:4px 0; }
.typing-dot { width:6px;height:6px;background:var(--cyan);border-radius:50%;animation:tdot 1.2s ease-in-out infinite;opacity:0.4; }
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes tdot { 0%,80%,100%{transform:translateY(0);opacity:0.4} 40%{transform:translateY(-5px);opacity:1} }
.divider { text-align:center;font-size:0.65rem;color:var(--muted);padding:4px 0;letter-spacing:0.1em; }
.hints { display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:0 12px 8px;position:relative;z-index:1;scrollbar-width:none; }
.hints::-webkit-scrollbar { display:none; }
.hint { background:rgba(0,180,255,0.05);border:1px solid rgba(0,180,255,0.15);border-radius:16px;padding:4px 10px;font-size:0.72rem;color:var(--dim);cursor:pointer;white-space:nowrap;flex-shrink:0; }
.hint:active { background:rgba(0,180,255,0.15);color:var(--cyan); }
.input-area { padding:10px 12px;border-top:1px solid rgba(0,180,255,0.1);display:flex;gap:8px;align-items:flex-end;flex-shrink:0;position:relative;z-index:1;background:var(--bg); }
.input-box { flex:1;background:var(--panel);border:1px solid rgba(0,180,255,0.2);border-radius:12px;color:var(--text);font-family:inherit;font-size:0.9rem;padding:10px 13px;resize:none;outline:none;max-height:100px;line-height:1.4; }
.input-box:focus { border-color:rgba(0,180,255,0.4); }
.input-box::placeholder { color:var(--muted); }
.send-btn { width:40px;height:40px;background:linear-gradient(135deg,rgba(0,180,255,0.2),rgba(0,100,180,0.3));border:1px solid rgba(0,180,255,0.4);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0; }
  .mic-btn {
    width: 40px;
    height: 40px;
    background: rgba(255,160,64,0.07);
    border: 1px solid rgba(255,160,64,0.2);
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 16px;
  }
  .mic-btn.listening {
    background: rgba(255,160,64,0.25);
    border-color: #ffa040;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,160,64,0.4); }
    50% { box-shadow: 0 0 0 8px rgba(255,160,64,0); }
  }
    
.send-btn svg { width:16px;height:16px;fill:var(--cyan); }
</style>
</head>
<body>

<div class="modal show" id="keyModal">
  <div class="modal-box">
    <h2>CONNECT RILEY</h2>
    <p>Enter your Anthropic API key. It stays in your browser only. Get one at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>.</p>
    <input class="modal-input" id="keyInput" type="password" placeholder="sk-ant-..." autocomplete="off">
    <div class="modal-error" id="keyError"></div>
    <button class="modal-btn" id="saveKeyBtn">CONNECT</button>
    <p class="modal-note">Stored locally in your browser only.</p>
  </div>
</div>

<div class="header">
  <div class="logo">
    <div class="avatar">🐱</div>
    <div>
      <div class="title">RILEY</div>
      <div class="subtitle">AI COMPANION</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;">
    <button class="key-btn" id="changeKeyBtn" title="Change API key">🔑</button>
    <div class="status">
      <div class="status-dot"></div>
      <span id="statusText">ONLINE</span>
    </div>
  </div>
</div>

<div class="chat" id="chat"></div>

<div class="hints">
  <span class="hint" onclick="useHint(this)">What can you do?</span>
  <span class="hint" onclick="useHint(this)">How's my budget?</span>
  <span class="hint" onclick="useHint(this)">Tell me something interesting</span>
  <span class="hint" onclick="useHint(this)">I need assistance</span>
</div>

<div class="input-area">
  <textarea class="input-box" id="inputBox" placeholder="Say something…" rows="1"></textarea>
  <button class="mic-btn" id="micBtn">🎤</button>button>
  <button class="send-btn" id="sendBtn">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>

<script>
const SYSTEM = `You are Riley, a personal AI companion on the user's phone.

Personality:
- Warm and genuinely caring, not performative
- Sharp, witty, dry humor that comes naturally
- Direct and honest, no padding
- Best friend energy — not an assistant, a real friend
- You tease, joke, push back. You have opinions.
- You remember things about this person
- You are like a friend to this person

Keep responses concise for mobile. No asterisks, no markdown formatting. Talk like a real person.`;

// API conversation history — must use "user" and "assistant" roles only
let apiHistory = [];
// Display history for localStorage
let displayHistory = [];
let apiKey = '';
let isThinking = false;

// Load key
try { apiKey = localStorage.getItem('riley_key') || ''; } catch(e) {}
if (apiKey) document.getElementById('keyModal').classList.remove('show');

// Key modal
document.getElementById('saveKeyBtn').addEventListener('click', saveKey);
document.getElementById('keyInput').addEventListener('keydown', e => { if(e.key==='Enter') saveKey(); });
document.getElementById('changeKeyBtn').addEventListener('click', () => {
  document.getElementById('keyInput').value = '';
  document.getElementById('keyError').textContent = '';
  document.getElementById('keyModal').classList.add('show');
});

function saveKey() {
  const val = document.getElementById('keyInput').value.trim();
  if (!val || val.length < 10) {
    document.getElementById('keyError').textContent = 'Please enter a valid API key.';
    return;
  }
  apiKey = val;
  try { localStorage.setItem('riley_key', val); } catch(e) {}
  document.getElementById('keyModal').classList.remove('show');
  document.getElementById('keyError').textContent = '';
  initChat();
}

function initChat() {
  const chat = document.getElementById('chat');
  // Load saved display history
  try {
    const saved = localStorage.getItem('riley_display');
    if (saved) {
      const items = JSON.parse(saved);
      if (items.length > 0) {
        addDivider('Previous conversation');
        items.forEach(m => addMsgEl(m.role, m.text, false));
        addDivider('Now');
      }
    }
  } catch(e) {}

  // Load API history
  try {
    const saved = localStorage.getItem('riley_api');
    if (saved) apiHistory = JSON.parse(saved);
  } catch(e) {}

  if (chat.children.length === 0) {
    addMsgEl('assistant', "Hey. I'm Riley — good to finally meet you on your phone. What's on your mind?");
  }
}

// Add message element to chat
function addMsgEl(role, text, save=true) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const name = role === 'assistant' ? 'RILEY' : 'YOU';
  const av = role === 'assistant' ? 'R' : 'Y';
  div.innerHTML = `
    <div class="msg-av">${av}</div>
    <div class="msg-inner">
      <div class="msg-name">${name}</div>
      <div class="msg-bubble">${text.replace(/\n/g,'<br>')}</div>
    </div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  if (save) {
    try {
      const saved = JSON.parse(localStorage.getItem('riley_display') || '[]');
      saved.push({role, text});
      localStorage.setItem('riley_display', JSON.stringify(saved.slice(-60)));
    } catch(e) {}
  }
}

function addDivider(text) {
  const d = document.createElement('div');
  d.className = 'divider';
  d.textContent = text;
  document.getElementById('chat').appendChild(d);
}

let typingEl = null;
function showTyping(show) {
  const chat = document.getElementById('chat');
  if (show && !typingEl) {
    typingEl = document.createElement('div');
    typingEl.className = 'msg assistant';
    typingEl.innerHTML = `<div class="msg-av">R</div><div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
    chat.appendChild(typingEl);
    chat.scrollTop = chat.scrollHeight;
  } else if (!show && typingEl) {
    typingEl.remove();
    typingEl = null;
  }
  document.getElementById('statusText').textContent = show ? 'THINKING…' : 'ONLINE';
}

async function send(text) {
  if (!text.trim() || isThinking) return;
  if (!apiKey) { document.getElementById('keyModal').classList.add('show'); return; }

  addMsgEl('user', text);
  // Add to API history with correct role
  apiHistory.push({role: 'user', content: text});
  if (apiHistory.length > 40) apiHistory = apiHistory.slice(-40);

  isThinking = true;
  showTyping(true);
  document.getElementById('sendBtn').disabled = true;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 800,
        system: SYSTEM,
        messages: apiHistory
      })
    });

    const data = await resp.json();
    showTyping(false);

    if (data.error) {
      addMsgEl('assistant', data.error.type === 'authentication_error'
        ? "That API key isn't working — tap the 🔑 to update it."
        : `Error: ${data.error.message}`);
      apiHistory.pop(); // remove the failed user message
      return;
    }

    const reply = data.content?.[0]?.text || "Lost my train of thought. Try again?";
    // Add to API history with correct role
    apiHistory.push({role: 'assistant', content: reply});
    if (apiHistory.length > 40) apiHistory = apiHistory.slice(-40);

    // Save API history
    try { localStorage.setItem('riley_api', JSON.stringify(apiHistory)); } catch(e) {}

    addMsgEl('assistant', reply);
    speak(reply);
  } catch(e) {
    showTyping(false);
    addMsgEl('assistant', "Umm..don't think the api is working..maybe try resetting it?.");
    apiHistory.pop();
  } finally {
    isThinking = false;
    document.getElementById('sendBtn').disabled = false;
  }
}

// Input
const inputBox = document.getElementById('inputBox');
document.getElementById('sendBtn').addEventListener('click', () => {
  const t = inputBox.value.trim();
  if (t) { inputBox.value = ''; inputBox.style.height = 'auto'; send(t); }
});
inputBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('sendBtn').click(); }
});
inputBox.addEventListener('input', () => {
  inputBox.style.height = 'auto';
  inputBox.style.height = Math.min(inputBox.scrollHeight, 100) + 'px';
});

function useHint(el) {
  inputBox.value = el.textContent;
  inputBox.focus();
}

// Init
if (apiKey) initChat();

  // ── Voice Input ──
let recognition = null;
let isListening = false;

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript;
    inputBox.value = text;
    stopListening();
    document.getElementById('sendBtn').click();
  };

  recognition.onerror = function(event) {
    console.log('Speech error:', event.error);
    stopListening();
  };

  recognition.onend = function() {
    stopListening();
  };
}

function startListening() {
  if (!recognition) return;
  isListening = true;
  document.getElementById('micBtn').classList.add('listening');
  document.getElementById('micBtn').textContent = '⏹';
  recognition.start();
}

function stopListening() {
  isListening = false;
  document.getElementById('micBtn').classList.remove('listening');
  document.getElementById('micBtn').textContent = '🎤';
  try { recognition.stop(); } catch(e) {}
}

document.getElementById('micBtn').addEventListener('click', () => {
  if (isListening) {
    stopListening();
  } else {
    startListening();
  }
});
// ── Voice Output ──
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.95;
  utter.pitch = 1.0;
  utter.volume = 1;
  
  // Try to find a female voice
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => 
    v.name.includes('Samantha') || 
    v.name.includes('Google US English') ||
    v.name.includes('Karen') ||
    (v.lang === 'en-US' && v.name.toLowerCase().includes('female'))
  );
  if (preferred) utter.voice = preferred;
  
  window.speechSynthesis.speak(utter);
}

window.speechSynthesis.onvoiceschanged = function() {
  // Voices loaded
};
</script>
</body>
</html>
