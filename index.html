<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name = "viewport" content="width=device-width, initial-scale=1.0">
  <title>Riley</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0d0d;
    color: #e0e0e0;
    font-family: monospace;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 12px 16px;
    border-bottom: 1px solid #333;
    font-size: 1.2rem;
    color: #00ffcc;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  main {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .user-msg {
    background: #1a1a2e;
    border: 1px solid #00ffcc44;
    align-self: flex-end;
    color: #00ffcc;
  }

  .riley-msg {
    background: #111;
    border: 1px solid #333;
    align-self: flex-start;
    color: #e0e0e0;
  }

  #input-row {
    display: flex;
    padding: 12px;
    gap: 8px;
    border-top: 1px solid #333;
  }

  textarea {
    flex: 1;
    background: #111;
    color: #e0e0e0;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px;
    font-family: monospace;
    resize: none;
    height: 44px;
  }

  button {
    background: #00ffcc;
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    font-weight: bold;
  }
</style>
  
</head>  
  <body>
<div id="key-modal">
  <div id="key-box">
    <h2>Enter Your API Key</h2>
    <p>Your Key is saved locally and never sent anywhere except Anthropic.</p>
    <input type="password" id="key-input" placeholder="sk-ant-. . .">
    <button onclick="saveKey()">save</button>
  </div>
</div>
    <div id="app" style="display:none">
      <header>
        <span>Riley</span>
      </header>
      <main>
        <div id="messages"></div>
        <div id="input-row">
          <textarea id= "user-input" placeholder="whats up..?"></textarea>
          <button onclick="sendMessage()">Send</button>
        </div>
      </main>
    </div>

    <script>
      const API_URL = 'https://api.anthropic.com/v1/messages';
      const MODEL = 'claude-sonnet-4-5';

      async function askRiley(userMessage) {
        const key = getKey();
        if (!key) return 'No api key found';

        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'x-api-key': key,
            'anthropic-version': '2023-06-01',
            'content-type': 'application/json',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: MODEL,
              max_tokens:1024,
            messages: [
              {role: 'user', content: userMessage }
              ]
          })
        });

        const data = await response.json();
        return data.content[0].text;
      }
      
      function saveKey() {
        const key = document.getElementById('key-input').value.trim()
        if (!key) return;
        localStorage.setItem('riley-api-key', key);
        document.getElementById('key-modal').style.display = 'none';
        document.getElementById('app').style.display = 'block'
      }

      function getKey() {
        return localStorage.getItem('riley-api-key');
      }
      
     async function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  addMsg('user', text);
  const reply = await askRiley(text);
  addMsg('riley', reply);
}

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user-msg' : 'riley-msg');
  div.textContent = text;
  const messages = document.getElementById('messages');
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}
    </script>
</body>
</html>
