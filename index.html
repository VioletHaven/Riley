<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name = "viewport" content="width=device-width, initial-scale=1.0">
  <title>Riley</title>
</head>  
  <body>
<div id="key-modal">
  <div id="key-box">
    <h2>Enter Your API Key</h2>
    <p>Your Key is saved locally and never sent anywhere except Anthropic.</p>
    <input type="password" id="key-input" placeholder="sk-ant-. . .">
    <button onclick="saveKey()">save</button>
  </div>
</div>
    <div id="app" style="display:none">
      <header>
        <span>Riley</span>
      </header>
      <main>
        <div id="messages"></div>
        <div id="input-row">
          <textarea id= "user-input" placeholder="whats up..?"></textarea>
          <button onclick="sendMessage()">Send</button>
        </div>
      </main>
    </div>

    <script>
      const API_URL = 'https://api.anthropic.com/v1/messages';
      const MODEL = 'claude-sonnet-4-5';

      async function askRiley(userMessage) {
        const key = getKey();
        if (!key) return 'No api key found';

        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'x-api-key': key,
            'anthropic-version': '2023-06-01',
            'content-type': 'application/json',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: MODEL,
              max_tokens:1024,
            messages: [
              {role: 'user', content: userMessage }
              ]
          })
        });

        const data = await response.json();
        return data.content[0].text;
      }
      
      function saveKey() {
        const key = document.getElementById('key-input').value.trim()
        if (!key) return;
        localStorage.setItem('riley-api-key', key);
        document.getElementById('key-modal').style.display = 'none';
        document.getElementById('app').style.display = 'block'
      }

      function getKey() {
        return localStorage.getItem('riley-api-key');
      }
      
      async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';

        const reply = await askRiley(text);
        document.getElementById('messages').innerHTML += '<p>' + reply + '</p>';
      }
    </script>
</body>
</html>
