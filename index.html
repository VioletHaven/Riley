<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name = "viewport" content="width=device-width, initial-scale=1.0">
  <title>Riley</title>
</head>  
  <body>
<div id="key-modal">
  <div id="key-box">
    <h2>Enter Your API Key</h2>
    <p>Your Key is saved locally and never sent anywhere except Anthropic.</p>
    <input type="password" id="key-input" placeholder="sk-ant-. . .">
    <button onclick="saveKey()">save</button>
  </div>
</div>
    <div id="app" style="display:none">
      <header>
        <span>Riley</span>
      </header>
      <main>
        <div id="messages"></div>
        <div id="input-row">
          <textarea id= "user-input" placeholder="whats up..?"></textarea>
          <button onclick="sendMessage()">Send</button>
        </div>
      </main>
    </div>

    <script>
      function saveKey() {
        const key = document.getElementById('key-input').value.trim()
        if (!key) return;
        localStorage.setItem('riley-api-key', key);
        document.getElementById('key-modal').style.display = 'none';
        document.getElementById('app').style.display = 'block'
      }

      function getKey() {
        return localStorage.getItem('riley-api-key');
      }
      
      function sendMessage() {
        const input = document.getElementById('user-input');
        console.log('sending', input.value);
        input.value = '';
      }
    </script>
</body>
</html>
